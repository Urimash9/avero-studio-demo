<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVERO — revisão da Build 01.7</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050a13;color:#e8f2ff;font:16px Arial,sans-serif}header{padding:16px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:18px;margin:0}label{display:flex;align-items:center;gap:10px}select,a{font:inherit;color:inherit;background:#0d1b2a;border:1px solid #8caac8;border-radius:4px;padding:10px;min-height:44px}a{text-decoration:none}select:focus-visible,a:focus-visible{outline:2px solid #4da3ff;outline-offset:3px}p{margin:0;color:#bac6d8;font-size:14px}.frame-wrap{width:max-content;min-width:100%;padding:0 20px 20px}iframe{display:block;border:0;max-width:none;background:#050a13}
</style>
</head>
<body>
<header><h1>Projetos · Build 01.7</h1><label for="width">Largura <select id="width"><option>1440</option><option>1280</option><option>1101</option><option>1100</option><option>1024</option><option>900</option><option>768</option><option>430</option><option>390</option><option>360</option><option>320</option></select></label><label for="area">Área <select id="area"><option value="top">Hero</option><option value="posicionamento">Posicionamento</option><option value="servicos">Serviços</option><option value="colecao">Coleção</option><option value="projetos" selected>Projetos</option><option value="sobre">Método</option><option value="contato">Contato</option></select></label><label><input type="checkbox" id="overview"> Visão geral</label><a href="../index.html">Abrir Home</a><p>Prévia isolada para revisão. Larguras reais no iframe. Selecione a área ou use a rolagem interna.</p></header>
<div class="frame-wrap"><iframe id="home" title="Home AVERO na largura selecionada" src="../index.html#projetos" width="1440" height="1000"></iframe></div>
<script>
const select=document.getElementById('width');const frame=document.getElementById('home');const overview=document.getElementById('overview');
const requested=new URLSearchParams(location.search).get('width');
if([...select.options].some(option=>option.value===requested))select.value=requested;
function resize(){const wide=Number(select.value)>1100;const scaled=overview.checked&&wide;frame.width=select.value;frame.height=scaled?'1200':Number(select.value)<=430?'1250':'1000';frame.style.transform=scaled?'scale(.66)':'none';frame.style.transformOrigin='top left';frame.parentElement.style.height=scaled?'820px':'auto';}
overview.addEventListener('change',resize);
select.addEventListener('change',resize);resize();
const area=document.getElementById('area');
area.addEventListener('change',()=>{frame.src='../index.html#'+area.value;});
</script>
</body>
</html>
